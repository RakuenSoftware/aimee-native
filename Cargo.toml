[package]
name = "aimee-qwen"
version = "0.1.0"
edition = "2024"
publish = false
license = "LicenseRef-Proprietary"

[features]
default = ["torch"]
torch = ["dep:tch"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tch = { version = "0.26.0", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false

[profile.release-diagnostics]
inherits = "release"
debug = 2
strip = "none"

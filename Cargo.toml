[package]
name = "aimee-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native memory integration for Aimee-supported model runtimes"
repository = "https://github.com/RakuenSoftware/aimee-native"
license = "AGPL-3.0-only"

[features]
# Dedicated model wheels select one adapter; unbound development exposes all.
adapter-gemma4-12b = []
adapter-gemma4-26b = []
adapter-qwen3-8-27b = []
adapter-gemma4-e2b = []
adapter-gemma4-e4b = []
default = ["torch"]
torch = ["dep:tch"]
# Client build excludes offline authoring entry points and research diagnostics.
native-client = ["torch"]
vllm-client = []
# Runtime-only ATen/CPython bridge; does not enable tch or private encoding.
vllm-runtime = ["vllm-client"]
# Public torch operations through CPython; no linked GPU or ATen ABI.
vllm-portable = ["vllm-runtime"]
preparation-service = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
lz4 = "1"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tch = { version = "0.26.0", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tiny_http = "0.12"

tempfile = "3"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false

[profile.release-diagnostics]
inherits = "release"
debug = 2
strip = "none"

[[bin]]
name = "prepared-memory-bench"
path = "src/bin/prepared-memory-bench.rs"
required-features = ["torch"]

[[bin]]
name = "compact-memory-bench"
path = "src/bin/compact-memory-bench.rs"
required-features = ["torch"]

[[bin]]
name = "compact-device-bench"
path = "src/bin/compact-device-bench.rs"
required-features = ["torch"]

[build-dependencies]
cc = "1"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "native-prepare"
path = "src/bin/native-prepare.rs"
required-features = ["preparation-service"]

[[bin]]
name = "native-codec-bench"
path = "src/bin/native-codec-bench.rs"
required-features = ["preparation-service"]

[package]
name = "aimee-native-launcher"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[[bin]]
name = "aimee-native"
path = "src/main.rs"

[[bin]]
name = "aimee-model-client"
path = "src/model_client.rs"
required-features = ["model-plugin-client"]

[features]
# Explicit non-production launcher for isolated signed end-to-end release tests.
lab-release = []
model-plugin-client = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0

[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "aimee-vllm-development"
version = "0.2.0"
description = "Private build and test bridge; releases are dedicated model plugins"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = ["vllm>=0.30.0,<0.31"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aimee_vllm*"]

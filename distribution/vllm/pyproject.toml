[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "aimee-vllm"
version = "0.1.0"
description = "Private Aimee native-memory extension for unmodified vLLM"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = ["vllm==0.30.0"]

[project.entry-points."vllm.general_plugins"]
aimee_native = "aimee_vllm:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["aimee_vllm*"]

[project.scripts]
aimee-vllm = "aimee_vllm.cli:main"

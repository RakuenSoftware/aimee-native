[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "aimee-vllm-development"
version = "0.2.0"
description = "Aimee Native build and test bridge for dedicated model plugins"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["vllm>=0.30.0,<0.31"]

[project.urls]
Repository = "https://github.com/RakuenSoftware/aimee-native"

[tool.setuptools.packages.find]
where = ["."]
include = ["aimee_vllm*"]

[project.entry-points."vllm.platform_plugins"]
aimee_cpu_native_platform = "aimee_vllm.cpu_plugin:register"

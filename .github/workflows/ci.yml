name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal "$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
      - name: Runtime tests without model weights
        run: cargo test --locked --no-default-features
      - name: Launcher and model client tests
        run: cargo test --manifest-path distribution/launcher/Cargo.toml --locked --features model-plugin-client
      - name: Packaging contracts
        run: python -m unittest discover -s distribution/release -p 'test_*.py' -v
      - name: Maintained documentation links
        run: python scripts/validation/docs.py
